
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>預約與聯絡 - 華安車業</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8f9fa;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #0099cc;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      color: #006699;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>預約與聯絡</h1>
  
        <p>地址：高雄市鼓山區鼓波街16號</p>
        <iframe 
          src="https://www.google.com/maps?q=高雄市鼓山區鼓波街16號&output=embed"
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        <form style="margin-top:2rem;">
          <label>姓名：<br><input type="text" style="width:100%; padding:0.5rem;" required></label><br><br>
          <label>聯絡電話：<br><input type="tel" style="width:100%; padding:0.5rem;" required></label><br><br>
          <label>預定日期：<br><input type="date" style="width:100%; padding:0.5rem;" required></label><br><br>
          <label>需求說明：<br><textarea rows="4" style="width:100%; padding:0.5rem;"></textarea></label><br><br>
          <button type="submit" style="padding:0.5rem 1rem; background:#0099cc; color:white; border:none; border-radius:5px;">送出預約</button>
        </form>
        
  <a href="index.html">← 回首頁</a>
